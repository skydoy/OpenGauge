# Base comum às duas línguas (rascunho de pré-visualização, não publicado).
site_author: skydoy
repo_url: https://github.com/skydoy/OpenGauge
repo_name: skydoy/OpenGauge
copyright: PolyForm Noncommercial 1.0.0 · Independent community project

extra:
  generator: false
  alternate:
    - name: Português
      link: ../pt/
      lang: pt
    - name: English
      link: ../en/
      lang: en
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/skydoy/OpenGauge
    - icon: fontawesome/solid/mug-hot
      link: https://ko-fi.com/skydoy

theme:
  name: material
  custom_dir: overrides
  logo: assets/img/icon.svg
  favicon: assets/img/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: custom/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: custom/moon
        name: Switch to light mode
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - def_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  omitted_files: warn
  absolute_links: ignore
  unrecognized_links: warn
  anchors: warn
